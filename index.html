<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DO OR DIE — SDE Placement Mission Control</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');

  :root{
    --deepRed:#B91C1C; --strongRed:#DC2626; --darkRed:#7F1D1D;
    --peach:#FFD6C2; --softPeach:#FFF1EB; --lightPeach:#FFF7F3;
    --white:#FFFFFF; --offWhite:#FFF9F7; --text:#171717; --textSec:#737373; --border:#E5E5E5;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--offWhite);color:var(--text);font-family:'Inter',sans-serif;}
  input[type=time]::-webkit-calendar-picker-indicator{filter:invert(0.3) sepia(1) saturate(4) hue-rotate(-20deg);}
  ::-webkit-scrollbar{height:6px;width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--peach);border-radius:4px;}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;}

  .layout{display:flex;max-width:1200px;margin:0 auto;}
  .sidebar{width:220px;flex-shrink:0;border-right:1px solid var(--border);min-height:100vh;padding:22px 14px;display:none;}
  .sidebar-logo{padding:0 8px 18px 8px;}
  .sidebar-title{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:22px;color:var(--deepRed);letter-spacing:-0.5px;}
  .sidebar-sub{font-size:10.5px;color:var(--textSec);margin-top:2px;line-height:1.4;}
  .sidebar-nav{margin-top:16px;display:flex;flex-direction:column;gap:3px;}
  .nav-btn{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;border:none;background:transparent;color:var(--text);font-weight:600;font-size:13.5px;cursor:pointer;text-align:left;width:100%;}
  .nav-btn.active{background:var(--deepRed);color:var(--white);}
  .sidebar-streak{margin-top:24px;padding:12px;background:var(--softPeach);border-radius:12px;}
  .sidebar-streak-row{display:flex;align-items:center;gap:6px;color:var(--deepRed);font-weight:800;font-size:13px;}
  .sidebar-streak-sub{font-size:11px;color:var(--textSec);margin-top:4px;}

  .main-col{flex:1;min-width:0;}
  .header{background:var(--white);border-bottom:1px solid var(--border);padding:18px 18px 0 18px;}
  .mobile-logo{display:flex;font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:20px;color:var(--deepRed);letter-spacing:-0.5px;margin-bottom:2px;}
  .mobile-tag{display:block;font-size:11px;color:var(--textSec);margin-bottom:12px;}
  .header-row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;padding-bottom:16px;}
  .header-day-label{font-size:11px;font-weight:700;color:var(--textSec);letter-spacing:0.5px;}
  .header-date{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:24px;color:var(--text);}
  .streak-chip{display:flex;align-items:center;gap:6px;background:var(--softPeach);padding:6px 12px;border-radius:10px;}
  .streak-chip span{font-weight:800;color:var(--deepRed);font-size:14px;}
  .progress-block{min-width:140px;}
  .progress-block-label{font-size:10.5px;color:var(--textSec);font-weight:700;}
  .progress-block-row{display:flex;align-items:center;gap:8px;}
  .progress-track{flex:1;height:8px;background:var(--softPeach);border-radius:5px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--deepRed);transition:width .5s ease;}
  .progress-block-num{font-weight:700;font-size:13px;color:var(--text);}
  .progress-block-sub{font-size:10.5px;color:var(--textSec);margin-top:2px;font-family:'JetBrains Mono',monospace;}

  .hazard{width:100%;background-image:repeating-linear-gradient(-45deg,var(--deepRed) 0px,var(--deepRed) 10px,var(--peach) 10px,var(--peach) 20px);opacity:.9;}

  .content{padding:18px;padding-bottom:90px;}

  .view-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;color:var(--text);}
  .view-header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;flex-wrap:wrap;gap:10px;}
  .btn-primary{background:var(--deepRed);color:var(--white);border:none;border-radius:9px;padding:8px 13px;font-weight:700;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .btn-primary:disabled{background:var(--border);cursor:not-allowed;}
  .btn-dark{background:var(--darkRed);color:var(--white);border:none;border-radius:9px;padding:8px 13px;font-weight:700;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .btn-ghost{background:var(--white);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px 16px;font-weight:600;font-size:13.5px;cursor:pointer;}
  .btn-outline-sm{background:none;border:1px solid var(--border);border-radius:8px;padding:6px 11px;font-size:12px;font-weight:700;color:var(--deepRed);cursor:pointer;display:inline-flex;align-items:center;gap:5px;}
  .quote{font-size:12.5px;color:var(--textSec);margin-bottom:14px;font-style:italic;}

  .mission-complete{background:linear-gradient(135deg,var(--deepRed),var(--darkRed));color:var(--white);border-radius:14px;padding:18px 20px;margin-bottom:16px;}
  .mission-complete h3{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:20px;margin:0;}
  .mission-complete p{font-size:13px;opacity:.9;margin-top:3px;}

  .empty{text-align:center;padding:50px 20px;color:var(--textSec);font-size:14px;}

  .task-row{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--white);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;}
  .task-row.done{background:var(--softPeach);}
  .task-row.flex{opacity:.85;}
  .task-check{background:none;border:none;cursor:pointer;padding:0;color:var(--border);flex-shrink:0;display:flex;}
  .task-check.done{color:var(--deepRed);}
  .task-time{min-width:90px;flex-shrink:0;}
  .task-time .start{font-size:12px;font-weight:700;color:var(--text);font-family:'JetBrains Mono',monospace;}
  .task-time .end{font-size:10.5px;color:var(--textSec);font-family:'JetBrains Mono',monospace;}
  .task-body{flex:1;min-width:0;}
  .task-name{font-size:14px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .task-name.done{text-decoration:line-through;text-decoration-color:var(--deepRed);}
  .task-meta{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;align-items:center;}
  .task-meta .dur{font-size:10.5px;color:var(--textSec);font-family:'JetBrains Mono',monospace;}
  .task-meta .flex-label{font-size:10.5px;color:var(--textSec);}
  .task-actions{display:flex;gap:5px;flex-shrink:0;}

  .pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:0.3px;background:var(--softPeach);color:var(--darkRed);border:1px solid var(--peach);white-space:nowrap;}
  .pill.muted{background:var(--lightPeach);color:var(--textSec);border:1px solid var(--border);}

  .icon-btn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--white);color:var(--textSec);cursor:pointer;}
  .icon-btn.danger{color:var(--deepRed);}
  .icon-btn:hover{background:var(--lightPeach);}
  .icon-btn.danger:hover{background:#FDEDEC;}

  .card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:18px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(23,23,23,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
  .modal-box{background:var(--white);width:100%;max-width:480px;max-height:88vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:20px;box-shadow:0 -10px 40px rgba(0,0,0,.2);}
  .modal-box.wide{max-width:640px;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .modal-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;color:var(--text);}
  .modal-close{border:none;background:var(--lightPeach);border-radius:8px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--textSec);}

  .field{margin-bottom:12px;}
  .field-label{font-size:11px;font-weight:700;color:var(--textSec);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px;}
  .input,select.input,textarea.input{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--border);font-size:14px;color:var(--text);background:var(--offWhite);outline:none;font-family:inherit;}
  textarea.input{min-height:60px;resize:vertical;}
  .row-2{display:flex;gap:10px;}
  .row-2 > div{flex:1;}
  .dur-hint{font-size:12px;color:var(--textSec);margin-top:-6px;margin-bottom:12px;}

  .day-chip{padding:6px 10px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:var(--white);color:var(--text);}
  .day-chip.on{border-color:var(--deepRed);background:var(--deepRed);color:var(--white);}
  .day-chip-lg{padding:7px 12px;border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:var(--white);color:var(--text);}
  .day-chip-lg.on{border-color:var(--deepRed);background:var(--deepRed);color:var(--white);}
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;}

  .toggle-2{display:flex;background:var(--lightPeach);border-radius:10px;padding:3px;}
  .toggle-2 button{flex:1;border:none;border-radius:8px;padding:8px 10px;font-size:12.5px;font-weight:700;cursor:pointer;background:transparent;color:var(--textSec);}
  .toggle-2 button.on{background:var(--deepRed);color:var(--white);}

  .modal-actions{display:flex;justify-content:space-between;margin-top:18px;gap:10px;}
  .modal-actions .right{display:flex;gap:8px;}

  .tabs{display:flex;background:var(--lightPeach);border-radius:10px;padding:3px;}
  .tabs button{border:none;border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:700;cursor:pointer;background:transparent;color:var(--textSec);text-transform:capitalize;}
  .tabs button.on{background:var(--deepRed);color:var(--white);}

  .day-strip{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px;}
  .day-strip button{flex-shrink:0;padding:9px 14px;border-radius:10px;cursor:pointer;border:1px solid var(--border);background:var(--white);color:var(--text);font-weight:700;font-size:12.5px;}
  .day-strip button.on{border-color:var(--deepRed);background:var(--deepRed);color:var(--white);}

  .week-grid{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px;overflow-x:auto;}
  .week-col{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:10px;min-width:150px;}
  .week-col-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .week-task{display:block;width:100%;text-align:left;background:var(--lightPeach);border:none;border-radius:6px;padding:5px 7px;margin-bottom:5px;cursor:pointer;}
  .week-task .t{font-size:10px;color:var(--textSec);font-family:'JetBrains Mono',monospace;}
  .week-task .n{font-size:11.5px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .week-add{width:100%;background:none;border:1px dashed var(--border);border-radius:6px;padding:5px 0;color:var(--textSec);font-size:11px;cursor:pointer;margin-top:2px;}

  .month-nav{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:14px;}
  .month-title{font-weight:700;font-size:15px;color:var(--text);}
  .month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .month-dow{text-align:center;font-size:10.5px;font-weight:700;color:var(--textSec);}
  .month-cell{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;border:1px solid transparent;}
  .month-legend{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:11px;color:var(--textSec);flex-wrap:wrap;}
  .legend-sw{width:10px;height:10px;border-radius:3px;display:inline-block;}

  .roadmap-card{border-radius:14px;padding:16px;}
  .roadmap-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .roadmap-cols{display:flex;gap:20px;margin-bottom:12px;flex-wrap:wrap;}
  .roadmap-lab{font-size:10.5px;opacity:.75;font-weight:700;text-transform:uppercase;}
  .roadmap-val{font-size:14px;font-weight:700;}
  .roadmap-slider-row{display:flex;align-items:center;gap:10px;}
  .roadmap-slider-row input[type=range]{flex:1;}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px;}
  .stat-card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:13px;}
  .stat-icon{color:var(--deepRed);margin-bottom:6px;}
  .stat-val{font-size:20px;font-weight:800;color:var(--text);font-family:'Space Grotesk',sans-serif;}
  .stat-unit{font-size:11px;color:var(--textSec);font-weight:600;}
  .stat-lab{font-size:11px;color:var(--textSec);}

  .grace-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px;}
  .grace-day-lab{font-size:9.5px;color:var(--textSec);margin-bottom:4px;font-weight:700;text-align:center;}
  .grace-cell{width:100%;aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;}

  .cat-bar-row{margin-bottom:8px;}
  .cat-bar-head{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px;}
  .cat-bar-track{height:7px;background:var(--softPeach);border-radius:4px;overflow:hidden;}
  .cat-bar-fill{height:100%;background:var(--deepRed);}

  .counter-card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:14px;}
  .counter-lab{font-size:11px;color:var(--textSec);font-weight:700;margin-bottom:8px;}
  .counter-row{display:flex;align-items:center;gap:10px;}
  .counter-btn{width:26px;height:26px;border-radius:7px;border:1px solid var(--border);background:var(--lightPeach);cursor:pointer;font-weight:800;color:var(--text);}
  .counter-btn.plus{background:var(--deepRed);color:var(--white);border:none;}
  .counter-num{font-size:20px;font-weight:800;color:var(--deepRed);min-width:30px;text-align:center;font-family:'Space Grotesk',sans-serif;}

  .bottomnav{position:fixed;left:0;right:0;bottom:0;background:var(--white);border-top:1px solid var(--border);display:flex;padding:6px 4px;z-index:50;box-shadow:0 -4px 14px rgba(0,0,0,.06);}
  .bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;background:none;border:none;color:var(--textSec);cursor:pointer;}
  .bottomnav button.active{color:var(--deepRed);}
  .bottomnav span{font-size:9.5px;font-weight:700;}

  .more-sheet-overlay{position:fixed;inset:0;background:rgba(23,23,23,.5);z-index:99;}
  .more-sheet{position:absolute;bottom:0;left:0;right:0;background:var(--white);border-radius:16px 16px 0 0;padding:16px;}
  .more-sheet button{width:100%;display:flex;align-items:center;gap:12px;padding:13px 10px;background:none;border:none;border-bottom:1px solid var(--border);cursor:pointer;color:var(--text);font-weight:600;font-size:14.5px;text-align:left;}

  .hint-box{font-size:12.5px;color:var(--textSec);background:var(--lightPeach);padding:10px;border-radius:8px;margin-top:4px;margin-bottom:6px;}

  @media (min-width:900px){
    .sidebar{display:block !important;}
    .bottomnav{display:none !important;}
    .mobile-logo,.mobile-tag{display:none !important;}
  }
</style>
</head>
<body>
<div id="root"></div>
<div id="modalRoot"></div>

<script>
/* ============================= constants ============================= */
const C = {
  deepRed:"#B91C1C", strongRed:"#DC2626", darkRed:"#7F1D1D",
  peach:"#FFD6C2", softPeach:"#FFF1EB", lightPeach:"#FFF7F3",
  white:"#FFFFFF", offWhite:"#FFF9F7", text:"#171717", textSec:"#737373", border:"#E5E5E5",
};
const DAYS = ["sun","mon","tue","wed","thu","fri","sat"];
const DAY_LABEL = {sun:"Sunday",mon:"Monday",tue:"Tuesday",wed:"Wednesday",thu:"Thursday",fri:"Friday",sat:"Saturday"};
const DAY_SHORT = {sun:"Sun",mon:"Mon",tue:"Tue",wed:"Wed",thu:"Thu",fri:"Fri",sat:"Sat"};

const CATEGORIES = ["SDE Placement","DSA","System Design","Java","SQL","Linux","AWS","DevOps","React","Generative AI","Aptitude","Project","Internship","Assessment","Class","Work","Personal","Other"];

const PRIORITIES = [
  {key:"critical",label:"Critical",emoji:"\u{1F534}",color:C.deepRed},
  {key:"high",label:"High",emoji:"\u{1F7E0}",color:C.strongRed},
  {key:"medium",label:"Medium",emoji:"\u{1F7E1}",color:"#E8A87C"},
  {key:"low",label:"Low",emoji:"\u26AA",color:C.border},
];
const PRIORITY_MAP = Object.fromEntries(PRIORITIES.map(p=>[p.key,p]));

const ROADMAP = [
  {month:"August",year:2026,monthIndex:7,weekday:"DSA Foundations",weekend:"Core Java + SQL"},
  {month:"September",year:2026,monthIndex:8,weekday:"\u2014",weekend:"Spring Boot"},
  {month:"October",year:2026,monthIndex:9,weekday:"Linux",weekend:"Spring Boot"},
  {month:"November",year:2026,monthIndex:10,weekday:"AWS",weekend:"Aptitude"},
  {month:"December",year:2026,monthIndex:11,weekday:"DevOps",weekend:"Aptitude"},
  {month:"January",year:2027,monthIndex:0,weekday:"React",weekend:"Generative AI"},
  {month:"February",year:2027,monthIndex:1,weekday:"System Design",weekend:"Mock Interviews"},
  {month:"March",year:2027,monthIndex:2,weekday:"Interview Prep",weekend:"Placement Drives"},
];

const MOTIVATION = [
  "NO ZERO DAYS.",
  "ONE MORE PROBLEM.",
  "BUILD. SOLVE. REPEAT.",
  "5 DAYS. 2 GRACE DAYS. NO EXCUSES.",
  "THE OFFER IS THE GOAL.",
  "YOU DON'T NEED MOTIVATION. YOU NEED CONSISTENCY.",
];

/* ============================= date utils ============================= */
function toISO(d){ const x=new Date(d); x.setHours(0,0,0,0); return x.toISOString().slice(0,10); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function startOfWeek(d){ const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-x.getDay()); return x; }
function todayObj(){ const x=new Date(); x.setHours(0,0,0,0); return x; }
function dayKeyFor(d){ return DAYS[new Date(d).getDay()]; }
function parseMin(t){ const [h,m]=t.split(":").map(Number); return h*60+m; }
function durationHours(start,end){ let diff=parseMin(end)-parseMin(start); if(diff<=0) diff+=1440; return Math.round((diff/60)*100)/100; }
function fmtTime(t){ const [h,m]=t.split(":").map(Number); const ap=h>=12?"PM":"AM"; let hh=h%12; if(hh===0) hh=12; return `${hh}:${String(m).padStart(2,"0")} ${ap}`; }
function fmtHours(h){ return `${h}h`; }
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }
function inRange(dateStr,range){ if(!range) return true; return dateStr>=range.start && dateStr<=range.end; }
function fmtDateShort(iso){ const d=new Date(iso+"T00:00:00"); return d.toLocaleDateString("en-US",{month:"short",day:"numeric"}); }
function monthBounds(year,monthIndex){ const first=new Date(year,monthIndex,1); const last=new Date(year,monthIndex+1,0); return {start:toISO(first),end:toISO(last)}; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ============================= seed data ============================= */
function defaultTasksForDay(){
  const blocks = [
    {start:"05:00",end:"06:00",name:"Morning Routine",category:"Personal",priority:"low",flexible:true},
    {start:"06:00",end:"08:00",name:"DSA",category:"DSA",priority:"critical"},
    {start:"08:00",end:"09:30",name:"Core Java / SQL",category:"Java",priority:"critical"},
    {start:"09:30",end:"11:00",name:"System Design \u2014 Own Prep",category:"System Design",priority:"critical"},
    {start:"11:00",end:"13:00",name:"SRM Class",category:"Class",priority:"high"},
    {start:"13:00",end:"14:00",name:"Lunch Break",category:"Personal",priority:"low",flexible:true},
    {start:"14:00",end:"17:00",name:"Besant Class",category:"Class",priority:"high"},
    {start:"17:00",end:"18:00",name:"Projects / Backend / Frontend",category:"Project",priority:"critical"},
    {start:"18:00",end:"19:00",name:"Assessments / Mock Interviews",category:"Assessment",priority:"critical"},
    {start:"19:00",end:"20:00",name:"Resume + Applications",category:"SDE Placement",priority:"critical"},
    {start:"20:00",end:"22:00",name:"Assessment",category:"Assessment",priority:"high"},
    {start:"22:00",end:"23:00",name:"Wind Down",category:"Personal",priority:"low",flexible:true},
    {start:"23:00",end:"01:00",name:"Mini Project / Internship",category:"Internship",priority:"high"},
    {start:"01:00",end:"04:00",name:"Work",category:"Work",priority:"medium"},
    {start:"04:00",end:"05:00",name:"YouTube",category:"Personal",priority:"low"},
  ];
  return blocks.map(b=>({
    id:uid(), groupId:null, start:b.start, end:b.end, name:b.name, category:b.category,
    priority:b.priority, notes:"", flexible:!!b.flexible, dateRange:null, completedDates:[],
  })).sort((a,b)=>parseMin(a.start)-parseMin(b.start));
}
function seedState(){
  const days={};
  DAYS.forEach(k=>{ days[k]=defaultTasksForDay(); });
  return { days, bestStreak:0, warRoom:{dsaProblems:0,mockInterviews:0,resumeApplications:0,interviewCalls:0}, roadmapProgress:{} };
}

/* ============================= stats ============================= */
function dayStats(state,dateObj){
  const dateStr=toISO(dateObj); const dayKey=dayKeyFor(dateObj);
  const tasks=(state.days[dayKey]||[]).filter(t=>!t.flexible && inRange(dateStr,t.dateRange));
  const total=tasks.length;
  const completed=tasks.filter(t=>t.completedDates.includes(dateStr)).length;
  const pct=total?Math.round((completed/total)*100):0;
  const hoursPlanned=tasks.reduce((s,t)=>s+durationHours(t.start,t.end),0);
  const hoursCompleted=tasks.filter(t=>t.completedDates.includes(dateStr)).reduce((s,t)=>s+durationHours(t.start,t.end),0);
  return {dateStr,dayKey,total,completed,pct,hoursPlanned:Math.round(hoursPlanned*10)/10,hoursCompleted:Math.round(hoursCompleted*10)/10};
}
function computeStreak(state){
  let cursor=todayObj();
  const t0=dayStats(state,cursor);
  if(t0.pct<80) cursor=addDays(cursor,-1);
  let streak=0;
  while(true){
    const s=dayStats(state,cursor);
    if(s.total>0 && s.pct>=80){ streak++; cursor=addDays(cursor,-1); } else break;
    if(streak>3650) break;
  }
  return streak;
}
function weekStats(state,weekStart){
  const today=todayObj();
  const dayList=[...Array(7)].map((_,i)=>addDays(weekStart,i));
  const stats=dayList.map(d=>({date:d,...dayStats(state,d)}));
  let hits=0,missesSoFar=0;
  stats.forEach(s=>{
    if(s.date>today) return;
    if(s.total===0) return;
    if(s.pct>=80) hits++; else missesSoFar++;
  });
  return {stats,hits,missesSoFar,primaryMet:Math.min(hits,5),graceUsed:Math.min(missesSoFar,2),weekComplete:hits>=5,weekBroken:missesSoFar>2};
}
function weeklyStreakCount(state){
  let cursor=startOfWeek(todayObj()); let count=0;
  const cur=weekStats(state,cursor);
  if(cur.weekComplete){ count++; }
  cursor=addDays(cursor,-7);
  while(true){
    const s=weekStats(state,cursor);
    if(s.weekComplete){ count++; cursor=addDays(cursor,-7); } else break;
    if(count>520) break;
  }
  return count;
}
function readinessScore(state){
  const last7=[...Array(7)].map((_,i)=>dayStats(state,addDays(todayObj(),-i)));
  const withData=last7.filter(s=>s.total>0);
  const avgCompletion=withData.length?withData.reduce((s,x)=>s+x.pct,0)/withData.length:0;
  const streak=computeStreak(state);
  const streakScore=Math.min(streak,30)/30*100;
  const wr=state.warRoom||{};
  const activityScore=Math.min(100,(wr.dsaProblems||0)*1.2+(wr.mockInterviews||0)*4+(wr.resumeApplications||0)*1);
  const score=Math.round(avgCompletion*0.45+streakScore*0.25+activityScore*0.30);
  return Math.max(0,Math.min(100,score));
}

/* ============================= storage ============================= */
const STORAGE_KEY="do-or-die-state-v1";

/* Storage backend detection:
   - Inside Claude's artifact viewer, window.storage exists and is used (syncs to your account).
   - Opened as a plain file / hosted anywhere else, window.storage does NOT exist, so we fall
     back to the browser's own localStorage — this is what makes the app work (and actually
     save) once you download it and use it outside Claude. */
const hasClaudeStorage = typeof window.storage !== "undefined" && window.storage !== null;

async function loadState(){
  if(hasClaudeStorage){
    try{ const res=await window.storage.get(STORAGE_KEY,false); if(res && res.value) return JSON.parse(res.value); }
    catch(e){ /* not found */ }
    return null;
  }
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
async function saveState(state){
  if(hasClaudeStorage){
    try{ await window.storage.set(STORAGE_KEY, JSON.stringify(state), false); } catch(e){ /* ignore */ }
    return;
  }
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){ /* storage full / blocked */ }
}

/* Ask the browser not to silently wipe this site's storage under disk pressure.
   This is the closest the web platform gets to "undeletable" — it does NOT stop
   you from clearing site data yourself in browser settings, but it does stop the
   browser from doing that automatically. Only relevant for the localStorage path. */
async function requestPersistentStorage(){
  if(hasClaudeStorage) return;
  try{
    if(navigator.storage && navigator.storage.persist){
      const already = navigator.storage.persisted ? await navigator.storage.persisted() : false;
      if(!already) await navigator.storage.persist();
    }
  }catch(e){ /* not supported in this browser, ignore */ }
}

const GH_CONFIG_KEY = "do-or-die-github-config-v1";

/* GitHub config (token, owner, repo, path, branch) is always stored the same
   way local device settings are — never inside `state`, so the token is never
   included in the JSON that actually gets pushed up to the repo. */
async function loadGithubConfig(){
  if(hasClaudeStorage){
    try{ const res=await window.storage.get(GH_CONFIG_KEY,false); if(res && res.value) return JSON.parse(res.value); }
    catch(e){ /* not found */ }
    return null;
  }
  try{ const raw=localStorage.getItem(GH_CONFIG_KEY); return raw?JSON.parse(raw):null; }
  catch(e){ return null; }
}
async function saveGithubConfig(){
  const cfg=ui.github;
  const toSave={token:cfg.token,owner:cfg.owner,repo:cfg.repo,path:cfg.path,branch:cfg.branch,autoSync:cfg.autoSync,sha:cfg.sha,lastSyncedAt:cfg.lastSyncedAt};
  if(hasClaudeStorage){
    try{ await window.storage.set(GH_CONFIG_KEY, JSON.stringify(toSave), false); } catch(e){ /* ignore */ }
    return;
  }
  try{ localStorage.setItem(GH_CONFIG_KEY, JSON.stringify(toSave)); } catch(e){ /* ignore */ }
}

function ghHeaders(token){
  return { "Authorization": `Bearer ${token}`, "Accept":"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28" };
}
function ghEncodePath(path){ return String(path||"").split("/").filter(Boolean).map(encodeURIComponent).join("/"); }
function b64EncodeUnicode(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64DecodeUnicode(str){ return decodeURIComponent(escape(atob(str))); }

async function githubFetchFile(cfg){
  const url=`https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${ghEncodePath(cfg.path)}?ref=${encodeURIComponent(cfg.branch||"main")}`;
  const res=await fetch(url,{headers:ghHeaders(cfg.token)});
  if(res.status===404) return {exists:false};
  if(!res.ok){ const t=await res.text().catch(()=>""); throw new Error(`GitHub read failed (${res.status}). ${t.slice(0,180)}`); }
  const data=await res.json();
  const content=b64DecodeUnicode((data.content||"").replace(/\n/g,""));
  return {exists:true, sha:data.sha, content};
}
async function githubPutFile(cfg,contentStr,sha,message){
  const url=`https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${ghEncodePath(cfg.path)}`;
  const body={ message: message||`DO OR DIE sync — ${new Date().toISOString()}`, content:b64EncodeUnicode(contentStr), branch: cfg.branch||"main" };
  if(sha) body.sha=sha;
  const res=await fetch(url,{method:"PUT",headers:{...ghHeaders(cfg.token),"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!res.ok){ const t=await res.text().catch(()=>""); throw new Error(`GitHub write failed (${res.status}). ${t.slice(0,240)}`); }
  return await res.json();
}

function ghConfigReady(){ const c=ui.github; return !!(c.token && c.owner && c.repo); }
function setGithubStatus(status,message){
  ui.github.status=status; ui.github.message=message;
  updateGithubStatusUI();
}
function updateGithubStatusUI(){
  const el=document.getElementById("gh-status");
  if(el) el.innerHTML=ghStatusHTML();
}
function timeAgo(ts){
  if(!ts) return "";
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<60) return "just now";
  const m=Math.floor(s/60); if(m<60) return `${m}m ago`;
  const h=Math.floor(m/60); if(h<24) return `${h}h ago`;
  const d=Math.floor(h/24); return `${d}d ago`;
}
function ghStatusHTML(){
  const cfg=ui.github;
  if(cfg.status==="syncing") return `<span style="color:${C.textSec};">${esc(cfg.message||"Syncing…")}</span>`;
  if(cfg.status==="error") return `<span style="color:${C.deepRed};font-weight:700;">${esc(cfg.message||"Something went wrong.")}</span>`;
  if(cfg.lastSyncedAt) return `<span style="color:${C.textSec};">${esc(cfg.message||"Synced")} · last synced ${timeAgo(cfg.lastSyncedAt)}</span>`;
  return `<span style="color:${C.textSec};">Not synced yet.</span>`;
}

async function pushToGithub(){
  const cfg=ui.github;
  if(!ghConfigReady()){ setGithubStatus("error","Add a token, owner and repo first."); return; }
  setGithubStatus("syncing","Pushing to GitHub…");
  try{
    let sha=cfg.sha;
    if(!sha){
      const existing=await githubFetchFile(cfg);
      if(existing.exists) sha=existing.sha;
    }
    const result=await githubPutFile(cfg, JSON.stringify(state,null,2), sha, "DO OR DIE: sync progress");
    cfg.sha=result.content.sha;
    cfg.lastSyncedAt=Date.now();
    setGithubStatus("synced","Pushed to GitHub");
    await saveGithubConfig();
  }catch(err){
    setGithubStatus("error", err.message||"Push failed.");
  }
}
async function pullFromGithub(){
  const cfg=ui.github;
  if(!ghConfigReady()){ setGithubStatus("error","Add a token, owner and repo first."); return; }
  setGithubStatus("syncing","Pulling from GitHub…");
  try{
    const existing=await githubFetchFile(cfg);
    if(!existing.exists){ setGithubStatus("error","No file there yet — push first to create it."); return; }
    const parsed=JSON.parse(existing.content);
    state=parsed;
    cfg.sha=existing.sha;
    cfg.lastSyncedAt=Date.now();
    await saveState(state);
    await saveGithubConfig();
    setGithubStatus("synced","Pulled from GitHub");
    render();
  }catch(err){
    setGithubStatus("error", "Pull failed: "+(err.message||"unknown error"));
  }
}
function scheduleGithubAutoSync(){
  if(!ui.github.autoSync || !ghConfigReady()) return;
  clearTimeout(ui.github.timer);
  ui.github.timer=setTimeout(()=>{ pushToGithub(); }, 4000);
}

function commit(){ persistAndRender(); }
async function persistAndRender(){
  const streak = computeStreak(state);
  if(streak > (state.bestStreak||0)) state.bestStreak = streak;
  render();

function findTask(dayKey,id){ return state.days[dayKey].find(t=>t.id===id); }
function sortDay(dayKey){ state.days[dayKey].sort((a,b)=>parseMin(a.start)-parseMin(b.start)); }

function toggleTaskDone(dayKey,id,dateStr){
  const t=findTask(dayKey,id); if(!t) return;
  if(t.completedDates.includes(dateStr)) t.completedDates=t.completedDates.filter(d=>d!==dateStr);
  else t.completedDates=[...t.completedDates,dateStr];
  commit();
}
function duplicateTask(dayKey,id){
  const t=findTask(dayKey,id); if(!t) return;
  const copy={...t,id:uid(),completedDates:[],groupId:null};
  state.days[dayKey].push(copy); sortDay(dayKey); commit();
}
function deleteTask(dayKey,id){
  state.days[dayKey]=state.days[dayKey].filter(t=>t.id!==id); commit();
}

    state.days[d].push(t); sortDay(d);
  });

  if(scope==="group"){
    const t=findTask(dayKey,taskId);
    const gid=t?t.groupId:null;

    });
  } else {
    state.days[dayKey]=state.days[dayKey].map(x=> x.id===taskId ? {...x,...payload} : x);
    sortDay(dayKey);
  }
}

function renderMonthHeatmap(){
  const now=new Date();
  const view=new Date(now.getFullYear(),now.getMonth()+ui.monthOffset,1);
  const year=view.getFullYear(), month=view.getMonth();
  const firstDay=new Date(year,month,1);
  const startOffset=firstDay.getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const cells=[];
  for(let i=0;i<startOffset;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(new Date(year,month,d));
  function cellColor(pct,total){
    if(total===0) return C.lightPeach;
    if(pct>=80) return C.deepRed;
    if(pct>=40) return C.strongRed;
    if(pct>0) return C.peach;
    return C.softPeach;
  }
  return `
  <div class="month-nav">
    <button class="icon-btn" data-action="monthNav" data-dir="-1">${ic('chevronLeft',15)}</button>
    <div class="month-title">${view.toLocaleString("en-US",{month:"long",year:"numeric"})}</div>
    <button class="icon-btn" data-action="monthNav" data-dir="1">${ic('chevronRight',15)}</button>
  </div>
  <div class="month-grid" style="margin-bottom:6px;">${DAYS.map(d=>`<div class="month-dow">${DAY_SHORT[d].toUpperCase()}</div>`).join("")}</div>
  <div class="month-grid">
    ${cells.map(d=>{
      if(!d) return `<div></div>`;
      const s=dayStats(state,d);
      const isToday=toISO(d)===toISO(now);
      const bg=cellColor(s.pct,s.total);
      const txt = (s.pct>=40 && s.total>0) ? C.white : C.text;
      return `<div class="month-cell" title="${d.getDate()}: ${s.pct}%" style="background:${bg};${isToday?`border:2px solid ${C.darkRed};`:''}">
        <span style="font-size:11px;font-weight:700;color:${txt};">${d.getDate()}</span>
      </div>`;
    }).join("")}
  </div>
  <div class="month-legend">
    <span><span class="legend-sw" style="background:${C.deepRed}"></span> 80%+</span>
    <span><span class="legend-sw" style="background:${C.strongRed}"></span> 40–79%</span>
    <span><span class="legend-sw" style="background:${C.peach}"></span> 1–39%</span>
    <span><span class="legend-sw" style="background:${C.softPeach}"></span> none</span>
  </div>`;
}

function svgLineChart(data,width=560,height=200){
  const pad={l:34,r:10,t:10,b:24};
  const w=width-pad.l-pad.r, h=height-pad.t-pad.b;
  const n=data.length;
  const x=i=> pad.l + (n<=1?0:(i/(n-1))*w);
  const y=v=> pad.t + h - (Math.max(0,Math.min(100,v))/100)*h;
  const pts=data.map((d,i)=>`${x(i)},${y(d.pct)}`).join(" ");
  const grid=[0,25,50,75,100].map(v=>`<line x1="${pad.l}" y1="${y(v)}" x2="${width-pad.r}" y2="${y(v)}" stroke="${C.border}" stroke-dasharray="3 3"/>`).join("");
  const labels=data.map((d,i)=>`<text x="${x(i)}" y="${height-6}" font-size="11" fill="${C.textSec}" text-anchor="middle">${esc(d.day)}</text>`).join("");
  const ylabels=[0,50,100].map(v=>`<text x="${pad.l-6}" y="${y(v)+4}" font-size="11" fill="${C.textSec}" text-anchor="end">${v}</text>`).join("");
  const dots=data.map((d,i)=>`<circle cx="${x(i)}" cy="${y(d.pct)}" r="3" fill="${C.deepRed}"/>`).join("");
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}">${grid}${ylabels}${labels}<polyline points="${pts}" fill="none" stroke="${C.deepRed}" stroke-width="2.5"/>${dots}</svg>`;
}
function svgBarChartH(data,width=560){
  const rowH=34, pad={l:140,r:40,t:6,b:6};
  const height=Math.max(160, data.length*rowH)+pad.t+pad.b;
  const max=Math.max(1,...data.map(d=>d.hours));
  const barW=width-pad.l-pad.r;
  const rows=data.map((d,i)=>{
    const y=pad.t+i*rowH;
    const w=(d.hours/max)*barW;
    return `
      <text x="${pad.l-8}" y="${y+rowH/2+4}" font-size="11" fill="${C.text}" text-anchor="end">${esc(d.name)}</text>
      <rect x="${pad.l}" y="${y+6}" width="${Math.max(2,w)}" height="${rowH-14}" rx="4" fill="${C.deepRed}"/>
      <text x="${pad.l+w+6}" y="${y+rowH/2+4}" font-size="11" fill="${C.textSec}">${d.hours}h</text>
    `;
  }).join("");
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}">${rows}</svg>`;
}

/* ============================= event delegation =============================
   Attached once, on document, so it covers both #root and #modalRoot
   (modals are rendered into a separate container that re-renders independently
   of the main view, so a listener scoped to #root alone would never see them). */
function attachGlobalListeners(){
  document.addEventListener("click",(e)=>{
    const el=e.target.closest("[data-action]");
    if(!el) return;
    const action=el.dataset.action;
    handleAction(action,el.dataset,e,el);
  });
  document.addEventListener("input",(e)=>{
    if(e.target.dataset && e.target.dataset.action==="roadmapSlider"){
      const month=e.target.dataset.month;
      state.roadmapProgress[month]=Number(e.target.value);
      const numEl=e.target.parentElement.querySelector("span");
      if(numEl) numEl.textContent=`${e.target.value}%`;
    }
  });
  document.addEventListener("change",(e)=>{
    if(e.target.dataset && e.target.dataset.action==="roadmapSlider"){ commit(); }
  });
}

function handleAction(action,ds,e,el){
  const today=todayObj();
  switch(action){
    case "navView": ui.view=ds.view; ui.moreOpen=false; render(); break;
    case "toggleMore": ui.moreOpen=true; render(); break;
    case "closeMore": {
      // el is either the overlay (close only if backdrop itself was clicked)
      // or a button inside the sheet with this same action (always close).
      const isOverlay = el.classList.contains("more-sheet-overlay");
      if(!isOverlay || e.target===el){ ui.moreOpen=false; render(); }
      break;
    }

    case "toggleTask": toggleTaskDone(ds.day,ds.id,ds.date); break;
    case "duplicateTask": duplicateTask(ds.day,ds.id); break;
    case "deleteTask": deleteTask(ds.day,ds.id); break;
    case "timerToggle": ui.timerId = (ui.timerId===ds.id)?null:ds.id; render(); break;

    case "editTask": openTaskModal({dayKey:ds.day, task:findTask(ds.day,ds.id)}); break;
    case "openAddTaskToday": openTaskModal({dayKey:dayKeyFor(today), task:null}); break;
    case "openAddTaskTT": openTaskModal({dayKey:ds.day, task:null}); break;

    case "ttSetMode": ui.ttMode=ds.mode; render(); break;
    case "ttSetDay": ui.ttActiveDay=ds.day; render(); break;
    case "monthNav": ui.monthOffset += Number(ds.dir); render(); break;

    case "wrBump": {
      const k=ds.key, delta=Number(ds.delta);
      state.warRoom[k]=Math.max(0,(state.warRoom[k]||0)+delta);
      commit();
      break;
    }

    case "openBulk": openBulkModal(); break;

    case "ghSaveConfig": {
      const ids=["gh-token","gh-owner","gh-repo","gh-path","gh-branch"];
      const map={"gh-token":"token","gh-owner":"owner","gh-repo":"repo","gh-path":"path","gh-branch":"branch"};
      ids.forEach(id=>{ const el=document.getElementById(id); if(el) ui.github[map[id]]=el.value.trim(); });
      saveGithubConfig();
      setGithubStatus("idle","Settings saved.");
      break;
    }
    case "ghPush": pushToGithub(); break;
    case "ghPull": {
      if(confirm("Pull will replace everything currently in this app with what's saved on GitHub. Continue?")) pullFromGithub();
      break;
    }

    case "exportData": exportData(); break;
    case "resetData": {
      if(confirm("Reset all tasks and progress to the default template? This cannot be undone.")){
        state=seedState(); commit();
      }
      break;
    }

    /* modal actions */
    case "modalClose": {
      // el is either the overlay (close only if backdrop itself was clicked)
      // or the X button with this same action (always close).
      const isOverlay = el.classList.contains("modal-overlay");
      if(!isOverlay || e.target===el){ closeModals(); }
      break;
    }
    case "taskDayToggle": {
      const d=ds.day;
      const i=taskModal.selDays.indexOf(d);
      if(i>=0) taskModal.selDays.splice(i,1); else taskModal.selDays.push(d);
      renderModals();
      break;
    }
    case "taskDateScopedToggle": {
      taskModal.dateScoped = !taskModal.dateScoped;
      renderModals();
      break;
    }
    case "taskDelete": {
      if(taskModal.task){ deleteTask(taskModal.dayKey, taskModal.task.id); }
      closeModals();
      break;
    }
    case "taskSave": {
      saveTaskModal();
      break;
    }
    case "bulkPreset": {
      const p=ds.preset;
      if(p==="all") bulkModal.selDays=[...DAYS];
      if(p==="weekdays") bulkModal.selDays=["mon","tue","wed","thu","fri"];
      if(p==="weekend") bulkModal.selDays=["sun","sat"];
      if(p==="none") bulkModal.selDays=[];
      renderModals();
      break;
    }
    case "bulkDayToggle": {
      const d=ds.day;
      const i=bulkModal.selDays.indexOf(d);
      if(i>=0) bulkModal.selDays.splice(i,1); else bulkModal.selDays.push(d);
      renderModals();
      break;
    }
    case "bulkScopeSet": {
      bulkModal.scope=ds.scope;
      renderModals();
      break;
    }
    case "bulkApply": {
      applyBulkModal();
      break;
    }
  }
}

function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download="do-or-die-data.json"; a.click();
  URL.revokeObjectURL(url);
}

    priority: task?task.priority:"medium", start: task?task.start:"09:00", end: task?task.end:"10:00",
    notes: task?task.notes:"",
    selDays: task ? [dayKey] : [dayKey],

    rangeStart: task&&task.dateRange ? task.dateRange.start : toISO(new Date()),
    rangeEnd: task&&task.dateRange ? task.dateRange.end : toISO(addDays(new Date(),30)),

}
function closeModals(){ taskModal=null; bulkModal=null; renderModals(); }

function saveTaskModal(){
  const m=taskModal;
  const nameEl=document.getElementById("tm-name");
  if(nameEl) m.name=nameEl.value.trim();
  if(!m.name){ return; }
  if(!m.task && m.selDays.length===0) return;
  if(m.dateScoped && m.rangeStart>m.rangeEnd) return;

  const payload={
    name:m.name, category:m.category, priority:m.priority, start:m.start, end:m.end, notes:m.notes,
    selDays:m.selDays, dateRange: m.dateScoped?{start:m.rangeStart,end:m.rangeEnd}:null,
  };
  if(m.task){
    const isGrouped=!!m.task.groupId;
    let scope="single";
    if(isGrouped){
      scope = confirm("This task repeats across other days. Click OK to update ALL days in this series, or Cancel to update only "+DAY_LABEL[m.dayKey]+".") ? "group" : "single";
    }
    saveEditPayload(m.dayKey,m.task.id,payload,scope);
  } else {
    addTaskFromPayload(payload);
  }
  closeModals();
  commit();
}

function bulkHintText(){
  const m=bulkModal;
  const daysTxt = m.selDays.map(d=>DAY_SHORT[d]).join(", ") || "no days yet";
  const scopeTxt = m.scope==='range'
    ? ` only between <b>${fmtDateShort(m.rangeStart)}</b> and <b>${fmtDateShort(m.rangeEnd)}</b>.`
    : ` every week, indefinitely.`;
  return `Applies <b>${esc(m.name||"this task")}</b> (${m.start}–${m.end}) to <b>${daysTxt}</b>${scopeTxt}`;
}
function updateBulkHint(){
  const el=document.getElementById("bm-hint");
  if(el) el.innerHTML=bulkHintText();
}
function applyBulkModal(){
  const m=bulkModal;
  const nameEl=document.getElementById("bm-name");
  if(nameEl) m.name=nameEl.value.trim();
  if(!m.name || m.selDays.length===0) return;
  if(m.scope==='range' && m.rangeStart>m.rangeEnd) return;
  bulkApply({
    name:m.name, start:m.start, end:m.end, category:m.category, priority:m.priority,
    selDays:m.selDays, dateRange: m.scope==='range' ? {start:m.rangeStart,end:m.rangeEnd} : null,
  });
  closeModals();
  commit();
}

function renderModals(){
  const mr=document.getElementById("modalRoot");
  mr.innerHTML = taskModal ? taskModalHTML() : (bulkModal ? bulkModalHTML() : "");
}

/* ============================= boot ============================= */
(async function boot(){
  document.getElementById("root").innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:300px;color:${C.textSec};font-family:Inter,sans-serif;">Loading mission control...</div>`;
  await requestPersistentStorage();
  const loaded = await loadState();
  state = loaded || seedState();
  const ghCfg = await loadGithubConfig();
  if(ghCfg) Object.assign(ui.github, ghCfg);
  attachGlobalListeners();
  render();
})();
</script>
